name = "singmaster"
version = "0.1.0"
defaultTargets = ["Singmaster", "Audit"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# CI builds with Lean and Mathlib v4.34.0. The files were also checked on live.lean-lang.org
# with v4.34.0 and v4.35.0 (see README).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# Definitions and proofs. Nothing here uses `sorry`.
[[lean_lib]]
name = "Singmaster"

# Fails the build if a listed result depends on a nonstandard axiom.
[[lean_lib]]
name = "Audit"
